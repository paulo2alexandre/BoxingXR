<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Boxing Ball</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  #info { position: absolute; top: 10px; left: 10px; color: #ccc; font-size: 13px; max-width: 380px; line-height: 1.45;
          background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 6px; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <b>VR Boxing Ball</b> — Meta Quest 3 / WebXR<br>
  In VR: punch the ball with controllers or bare hands. Start the round by punching the
  green START button or pointing at it and pulling the trigger.<br>
  On desktop: click the ball to punch it and click START to begin.
</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ---------- Settings ----------
const ROUND_SECONDS   = 120;                               // 2-minute round
const BALL_R          = 0.13;                              // ball radius (m)
const GLOVE_R         = 0.055;                             // fist collision radius (m)
const BALL_REST       = new THREE.Vector3(0, 1.70, -0.55); // ball rest position (in front of the player)
const MIN_PUNCH_SPEED = 0.9;                               // m/s needed to count as a punch
const HIT_COOLDOWN    = 0.2;                               // s between counted hits from the same hand

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking'] }));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d24);
scene.fog = new THREE.Fog(0x1a1d24, 6, 14);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0, 1.6, 0.45);
camera.lookAt(0, 1.45, -0.8);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 3, 1.5);
scene.add(sun);

// Floor + ring mat
const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 48),
  new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const ringMat = new THREE.Mesh(new THREE.PlaneGeometry(3, 3),
  new THREE.MeshStandardMaterial({ color: 0x2f4f7f, roughness: 0.8 }));
ringMat.rotation.x = -Math.PI / 2;
ringMat.position.set(0, 0.002, -0.3);
scene.add(ringMat);
const grid = new THREE.GridHelper(14, 28, 0x444a58, 0x333844);
grid.position.y = 0.001;
scene.add(grid);

// ---------- 1.1 Boxing ball (floor-standing reflex bag on a spring rod) ----------
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.9, roughness: 0.3 });

const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.06, 32), darkMat);
base.position.set(BALL_REST.x, 0.03, BALL_REST.z);
scene.add(base);
const BASE_TOP = new THREE.Vector3(BALL_REST.x, 0.06, BALL_REST.z);

const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 12), metalMat); // unit length, scaled each frame
scene.add(rod);

const ballMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.45, emissive: 0x000000 });
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 40, 28), ballMat);
ball.position.copy(BALL_REST);
scene.add(ball);
// white band so you can see it wobble
const band = new THREE.Mesh(new THREE.TorusGeometry(BALL_R * 1.001, 0.008, 8, 48),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }));
band.rotation.x = Math.PI / 2;
ball.add(band);

const ballVel = new THREE.Vector3();
const SPRING  = new THREE.Vector3(70, 250, 70); // stiffer vertically
const DAMPING = 3.0;
const _off = new THREE.Vector3(), _acc = new THREE.Vector3();

function stepBall(dt) {
  const sub = 2, h = dt / sub;
  for (let s = 0; s < sub; s++) {
    _off.subVectors(ball.position, BALL_REST);
    _acc.set(-SPRING.x * _off.x, -SPRING.y * _off.y, -SPRING.z * _off.z).addScaledVector(ballVel, -DAMPING);
    ballVel.addScaledVector(_acc, h);
    ball.position.addScaledVector(ballVel, h);
  }
  _off.subVectors(ball.position, BALL_REST);
  if (_off.length() > 0.45) {
    _off.setLength(0.45);
    ball.position.copy(BALL_REST).add(_off);
    ballVel.multiplyScalar(0.5);
  }
}

const UP = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
function updateRod() {
  _dir.subVectors(ball.position, BASE_TOP);
  const len = Math.max(0.01, _dir.length() - BALL_R * 0.8);
  _dir.normalize();
  rod.scale.set(1, len, 1);
  rod.position.copy(BASE_TOP).addScaledVector(_dir, len / 2);
  rod.quaternion.setFromUnitVectors(UP, _dir);
  ball.quaternion.copy(rod.quaternion); // ball tilts with the rod
}

// ---------- Canvas-texture panels ----------
function makePanel(widthM, heightM, pxW, pxH) {
  const canvas = document.createElement('canvas');
  canvas.width = pxW; canvas.height = pxH;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthM, heightM),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  return { canvas, ctx, tex, mesh };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 1.2 / 1.3 / countdown: scoreboard ----------
const board = makePanel(1.6, 0.625, 1024, 400);
board.mesh.position.set(0, 2.05, -1.5);
board.mesh.rotation.x = 0.12;
scene.add(board.mesh);

// ---------- State ----------
let hits = 0;
let running = false;
let finished = false;
let startTime = 0;
let shownSec = ROUND_SECONDS;
let shownPpm = 0;
let boardDirty = true;

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}

function drawBoard() {
  const { ctx, canvas } = board;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  roundRect(ctx, 4, 4, W - 8, H - 8, 28);
  ctx.fillStyle = 'rgba(12,14,20,0.92)'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#3a4152'; ctx.stroke();

  const cols = [
    { label: 'HITS',        value: String(hits),     color: '#ffffff' },
    { label: 'PUNCHES/MIN', value: String(shownPpm), color: '#ffd54f' },
    { label: 'TIME',        value: fmtTime(shownSec), color: running && shownSec <= 10 ? '#ff5252' : '#4fc3f7' },
  ];
  const colW = W / 3;
  ctx.textAlign = 'center';
  cols.forEach((c, i) => {
    const cx = colW * i + colW / 2;
    ctx.fillStyle = '#9aa3b5';
    ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText(c.label, cx, 90);
    ctx.fillStyle = c.color;
    ctx.font = 'bold 130px system-ui, sans-serif';
    ctx.fillText(c.value, cx, 230);
  });

  let status;
  if (running)       status = 'GO! Keep punching!';
  else if (finished) status = `TIME! ${hits} hits · ${shownPpm} per minute · press START to go again`;
  else               status = 'Press START to begin a 2-minute round';
  ctx.fillStyle = '#c8cfdd';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(status, W / 2, 335);

  board.tex.needsUpdate = true;
  boardDirty = false;
}

// ---------- 1.4 Start button ----------
const button = new THREE.Group();
button.position.set(0.5, 1.05, -0.35);
button.lookAt(0, 1.6, 0.3); // face the player, tilted up
scene.add(button);

const buttonBase = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, 0.03), darkMat);
button.add(buttonBase);
const buttonFace = makePanel(0.22, 0.09, 512, 210);
buttonFace.mesh.position.z = 0.0165;
button.add(buttonFace.mesh);
const buttonHitbox = buttonBase; // used for raycasts

function drawButton() {
  const { ctx, canvas } = buttonFace;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  roundRect(ctx, 6, 6, W - 12, H - 12, 30);
  ctx.fillStyle = running ? '#555b66' : '#2e7d32'; ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = running ? '#777' : '#66bb6a'; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 92px system-ui, sans-serif';
  ctx.fillText(running ? 'RUNNING' : (finished ? 'RESTART' : 'START'), W / 2, H / 2 + 4);
  buttonFace.tex.needsUpdate = true;
}

let buttonPressAnim = 0;
function pressButton() {
  audio();
  if (running) return; // ignore presses during a round
  buttonPressAnim = 1;
  hits = 0;
  shownPpm = 0;
  finished = false;
  running = true;
  startTime = clock.elapsedTime;
  shownSec = ROUND_SECONDS;
  tick(1000);            // first click right at the start
  drawButton();
  boardDirty = true;
}

// ---------- Audio (WebAudio, no files needed) ----------
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
['pointerdown', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => audio(), { passive: true }));

function tick(freq = 1000) {
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.06);
}

function thump(strength) {
  const a = audio(), t = a.currentTime;
  const vol = Math.min(1, 0.25 + strength * 0.12);
  // low "body" tone
  const o = a.createOscillator(), og = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
  og.gain.setValueAtTime(vol, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  o.connect(og).connect(a.destination);
  o.start(t); o.stop(t + 0.16);
  // short leather "slap" noise
  const len = Math.floor(a.sampleRate * 0.06);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const n = a.createBufferSource(); n.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
  const ng = a.createGain(); ng.gain.value = vol * 0.6;
  n.connect(f).connect(ng).connect(a.destination);
  n.start(t);
}

function bell() {
  const a = audio();
  [0, 0.35, 0.7].forEach(delay => {
    const t = a.currentTime + delay;
    [880, 1320, 2200].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3 / (i + 1), t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + 1.25);
    });
  });
}

// ---------- Hands / controllers (gloves) ----------
const gloveGeo = new THREE.SphereGeometry(GLOVE_R, 24, 16);
gloveGeo.scale(1, 0.9, 1.25);
const gloveColors = [0x1e88e5, 0xe53935];

const hands = [0, 1].map(i => {
  const ctrl = renderer.xr.getController(i);
  const grip = renderer.xr.getControllerGrip(i);
  const hand = renderer.xr.getHand(i);
  scene.add(ctrl, grip, hand);

  // pointer ray (only shown for physical controllers)
  const ray = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
  ray.scale.z = 1.5;
  ray.visible = false;
  ctrl.add(ray);

  const glove = new THREE.Mesh(gloveGeo, new THREE.MeshStandardMaterial({ color: gloveColors[i], roughness: 0.4 }));
  glove.visible = false;
  scene.add(glove);

  const h = {
    ctrl, grip, hand, ray, glove, source: null,
    pos: new THREE.Vector3(), prev: new THREE.Vector3(), vel: new THREE.Vector3(),
    valid: false, lastHit: -1, lastButton: -1,
  };
  ctrl.addEventListener('connected', e => { h.source = e.data; ray.visible = !e.data.hand; });
  ctrl.addEventListener('disconnected', () => { h.source = null; h.valid = false; glove.visible = false; ray.visible = false; });
  ctrl.addEventListener('selectstart', () => onSelect(h));
  return h;
});

const _tmp = new THREE.Vector3(), _q = new THREE.Quaternion();

// Returns true if we have a usable fist position this frame (written to `out`)
function readFist(h, out) {
  if (!h.source) return false;
  if (h.source.hand) {
    const j = h.hand.joints && h.hand.joints['middle-finger-phalanx-proximal'];
    if (j && j.visible) {
      j.getWorldPosition(out);
      const wrist = h.hand.joints['wrist'];
      if (wrist) h.glove.quaternion.copy(wrist.getWorldQuaternion(_q));
      return true;
    }
    return false;
  }
  if (h.grip.visible) {
    h.grip.getWorldPosition(out);
    h.glove.quaternion.copy(h.grip.getWorldQuaternion(_q));
    return true;
  }
  return false;
}

// Trigger / pinch: point at the START button
const raycaster = new THREE.Raycaster();
const _rotM = new THREE.Matrix4();
function onSelect(h) {
  audio();
  _rotM.identity().extractRotation(h.ctrl.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(h.ctrl.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_rotM);
  if (raycaster.intersectObject(buttonHitbox, false).length) pressButton();
}

function haptic(h, intensity, ms) {
  const act = h.source && h.source.gamepad && h.source.gamepad.hapticActuators && h.source.gamepad.hapticActuators[0];
  if (act && act.pulse) act.pulse(intensity, ms);
}

// ---------- Hits ----------
let flash = 0;
function registerHit(speed, h) {
  thump(speed);
  flash = 1;
  if (h) haptic(h, Math.min(1, 0.3 + speed * 0.15), 50);
  if (running) { hits++; boardDirty = true; }
}

const _n = new THREE.Vector3(), _rel = new THREE.Vector3();
function checkGloveBall(h, now) {
  _n.subVectors(ball.position, h.pos);
  const dist = _n.length();
  const minD = BALL_R + GLOVE_R;
  if (dist >= minD || dist < 1e-5) return;
  _n.divideScalar(dist); // glove -> ball
  _rel.subVectors(h.vel, ballVel);
  const approach = _rel.dot(_n);

  ball.position.addScaledVector(_n, minD - dist);  // push the ball out of the glove
  if (approach > 0) ballVel.addScaledVector(_n, approach * 1.2);

  if (approach > MIN_PUNCH_SPEED && now - h.lastHit > HIT_COOLDOWN) {
    h.lastHit = now;
    registerHit(approach, h);
  }
}

const _btnPos = new THREE.Vector3();
function checkGloveButton(h, now) {
  buttonBase.getWorldPosition(_btnPos);
  if (h.pos.distanceTo(_btnPos) < 0.09 && now - h.lastButton > 1.0) {
    h.lastButton = now;
    haptic(h, 0.6, 40);
    pressButton();
  }
}

// ---------- Desktop testing with the mouse ----------
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (renderer.xr.isPresenting) return;
  mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  if (raycaster.intersectObject(buttonHitbox, false).length) { pressButton(); return; }
  if (raycaster.intersectObject(ball, false).length) {
    ballVel.addScaledVector(raycaster.ray.direction, 2.5);
    registerHit(3, null);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Main loop ----------
const clock = new THREE.Clock();
drawBoard();
drawButton();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = clock.elapsedTime;

  // Countdown: one click per second
  if (running) {
    const elapsed = now - startTime;
    const remaining = Math.max(0, ROUND_SECONDS - elapsed);
    const sec = Math.ceil(remaining);
    if (sec !== shownSec) {
      shownSec = sec;
      if (sec > 0) tick(sec <= 3 ? 1600 : 1000); // higher pitch for the last 3 seconds
      boardDirty = true;
    }
    const ppm = elapsed >= 1 ? Math.round(hits / elapsed * 60) : 0;
    if (ppm !== shownPpm) { shownPpm = ppm; boardDirty = true; }

    if (remaining <= 0) {
      running = false;
      finished = true;
      shownSec = 0;
      shownPpm = Math.round(hits / (ROUND_SECONDS / 60));
      bell();
      drawButton();
      boardDirty = true;
    }
  }

  // Ball physics
  stepBall(dt);

  // Gloves
  for (const h of hands) {
    if (readFist(h, _tmp)) {
      if (h.valid && dt > 0) {
        h.vel.subVectors(_tmp, h.prev).divideScalar(dt);
      } else {
        h.vel.set(0, 0, 0);
      }
      h.prev.copy(_tmp);
      h.pos.copy(_tmp);
      h.valid = true;
      h.glove.position.copy(h.pos);
      h.glove.visible = true;
      checkGloveBall(h, now);
      checkGloveButton(h, now);
    } else {
      h.valid = false;
      h.glove.visible = false;
    }
  }

  updateRod();

  // Hit flash + button press animation
  if (flash > 0) {
    flash = Math.max(0, flash - dt * 6);
    ballMat.emissive.setRGB(flash * 0.6, flash * 0.3, flash * 0.1);
  }
  if (buttonPressAnim > 0) {
    buttonPressAnim = Math.max(0, buttonPressAnim - dt * 5);
    button.scale.z = 1 - buttonPressAnim * 0.5;
  }

  if (boardDirty) drawBoard();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
